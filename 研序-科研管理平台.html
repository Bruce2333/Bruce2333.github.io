function renderPapers(){const counts=k=>db.papers.filter(p=>p.kind===k).length;let list=db.papers.filter(p=>(paperFilter==='all'||p.kind===paperFilter)&&[p.title,p.journal,p.authors,...p.tags].join(' ').toLowerCase().includes(paperQuery.toLowerCase()));const views=['grid','list','kanban'];return heading('PAPER WORKSPACE','论文管理','从一个研究问题，到一篇发表成果。',`<button class="btn primary" data-action="newPaper">${icon('plus')} 新建论文</button>`)+`<div class="toolbar"><div class="filters">${[['all','全部',db.papers.length],['research','在研',counts('research')],['submitted','在投',counts('submitted')],['published','已发表',counts('published')]].map(([key,n,num])=>`<button class="filter ${paperFilter===key?'active':''}" data-action="paperFilter" data-value="${key}">${n}<span>${num}</span></button>`).join('')}</div><input class="field-input" id="paperSearch" placeholder="搜索论文标题、作者…" aria-label="筛选论文" value="${esc(paperQuery)}"><div class="segmented">${views.map((v,i)=>`<button class="${paperView===v?'active':''}" data-action="paperView" data-value="${v}" aria-label="${['卡片视图','列表视图','阶段看板'][i]}">${icon(['grid','list','layers'][i])}</button>`).join('')}</div></div>${paperView==='kanban'?`<div class="kanban">${Object.entries(stateNames).filter(([k])=>paperFilter==='all'||paperFilter===k).map(([k,n])=>`<section class="kanban-col"><h2>${n}<span>${list.filter(p=>p.kind===k).length}</span></h2>${list.filter(p=>p.kind===k).map(paperCard).join('')||'<div class="mini-note">暂无论文</div>'}</section>`).join('')}</div>`:list.length?`<div class="${paperView==='list'?'paper-list':'paper-grid'}">${list.map(paperCard).join('')}</div>`:empty('没有匹配的论文。试试其他条件，或新建一篇论文。','paper')}`}
function renderReferences(){
 const list=db.refs.filter(r=>[r.title,r.authors,r.journal,r.notes,r.citation||'',r.doi||'',...r.tags].join(' ').toLowerCase().includes(refQuery.toLowerCase()));
 return heading('READ SLOWLY, THINK DEEPLY','文献与笔记','读得有节奏，思考才有留白。',`<button class="btn" data-action="readingGoals">${icon('settings')} 阅读目标</button><button class="btn primary" data-action="newRef">${icon('plus')} 添加文献 / 书籍</button>`)+renderReadingGoals()+`<div class="toolbar"><span class="mini-note" style="margin-right:auto">${db.refs.length} 条文献与书籍 · 以读完日期统计完成量</span><input class="field-input" id="refSearch" placeholder="搜索标题、关键词、笔记…" aria-label="筛选文献" value="${esc(refQuery)}"></div><div class="paper-grid">${list.length?list.map(r=>`<article class="notes-card"><div class="paper-top"><span class="paper-code">${r.resourceType==='book'?'BOOK NOTES':r.language==='en'?'ENGLISH PAPER':'CHINESE PAPER'}</span><span class="badge ${r.readDate?'green':'gray'}">${r.readDate?'已读完':'未记录读完日期'}</span></div><h3>${esc(r.title)}</h3><div class="paper-meta">${esc(r.authors)} · ${esc(r.journal)}${r.year?' · '+esc(r.year):''}</div><div class="paper-tags">${r.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p>${esc(r.notes||'暂无阅读笔记，点击编辑记录你的思考。')}</p>${r.citation?`<details class="saved-citation"><summary>格式引文</summary><p>${esc(r.citation)}</p></details>`:''}<div class="reading-record-date">${r.readDate?'读完于 '+esc(r.readDate):'尚未记录读完日期'}</div><div class="paper-bottom"><div class="action-stack">${safeURL(r.url)?`<a class="text-button" target="_blank" rel="noopener noreferrer" href="${esc(safeURL(r.url))}">${icon('link')} 原文</a>`:''}${!r.readDate?`<button class="btn compact" data-action="markRead" data-id="${esc(r.id)}">${icon('check')} 今日读完</button>`:''}</div><button class="text-button" data-action="editRef" data-id="${esc(r.id)}">编辑笔记 ${icon('edit')}</button></div></article>`).join(''):empty('添加论文或书籍，开始记录阅读进度。','book')}</div>`;

function sortedTasks(){return [...db.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999'))}

function renderCalendar(list){const [y,m]=calMonth.split('-').map(Number);const first=new Date(y,m-1,1,12),start=(first.getDay()+6)%7,total=new Date(y,m,0).getDate(),cells=Math.ceil((start+total)/7)*7;let days='';for(let i=0;i<cells;i++){const d=new Date(y,m-1,1-start+i,12);const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const tasks=list.filter(t=>t.due===date);days+=`<div class="calendar-day ${d.getMonth()!==m-1?'outside':''} ${date===today?'today':''}"><button class="day-number" data-action="newTaskDate" data-date="${date}" aria-label="为 ${date} 添加任务">${d.getDate()}</button>${tasks.map(t=>`<button class="calendar-event ${t.done?'completed':''}" title="${esc(t.title)}" data-action="editTask" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div>`}return `<section class="calendar-panel"><div class="calendar-head"><h2>${y} 年 ${m} 月</h2><div class="heading-actions"><button class="icon-button" data-action="month" data-value="-1" aria-label="上个月">${icon('left')}</button><button class="btn compact" data-action="thisMonth">本月</button><button class="icon-button" data-action="month" data-value="1" aria-label="下个月">${icon('right')}</button></div></div><div class="week-row">${['一','二','三','四','五','六','日'].map(d=>`<span>周${d}</span>`).join('')}</div><div class="calendar-grid">${days}</div></section>${list.some(t=>!t.due)?'<p class="mini-note" style="margin-top:14px">未设置日期的任务仅在列表中显示。</p>':''}`}
function renderAchievements(){const list=db.papers.filter(p=>p.kind==='published').sort((a,b)=>Number(b.year)-Number(a.year)),year=new Date(today).getFullYear(),years=Array.from({length:6},(_,i)=>year-5+i),max=Math.max(1,...years.map(y=>list.filter(p=>Number(p.year)===y).length));return heading('THE FRUITS OF YOUR WORK','研究成果','看见长期积累，也看见下一个可能。',`<button class="btn" data-action="exportCSV">${icon('down')} 导出成果</button><button class="btn primary" data-action="newPublished">${icon('plus')} 录入成果</button>`)+`<div class="stats">${stat('累计发表',list.length,'篇','已归档的论文成果','award')}${stat('本年发表',list.filter(p=>Number(p.year)===year).length,'篇',year+' 年 · 研究积累','paper')}${stat('文献笔记',db.refs.length,'条','记录阅读与研究启发','book')}${stat('已完成任务',db.tasks.filter(t=>t.done).length,'项','每一个小目标，都在向前','check')}</div><section class="chart-panel"><h2>近六年发表记录</h2><div class="bars">${years.map(y=>{const n=list.filter(p=>Number(p.year)===y).length;return `<div class="bar-wrap"><span class="bar-value">${n}</span><div class="bar" style="height:${n/max*115}px"></div><span class="bar-year">${y}</span></div>`}).join('')}</div></section><div class="section-head"><h2>成果档案 <small>${list.length} 篇</small></h2><span class="mini-note">按发表年份排序</span></div>${list.length?`<div class="table-wrap"><table><thead><tr><th>论文与作者</th><th>期刊</th><th>年份</th><th>引用次数（手动）</th><th>操作</th></tr></thead><tbody>${list.map(p=>`<tr><td class="title-cell">${esc(p.title)}<small>${esc(p.authors)}</small></td><td>${esc(p.journal||'未设置')}</td><td>${esc(p.year)}</td><td>${esc(p.citations||0)}</td><td><button class="text-button" data-action="paperDetail" data-id="${esc(p.id)}">查看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('第一份研究成果，将从这里开始记录。','award')}`}

function validDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const d=new Date(value+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value;

function validExtensions(d){

  if(d.readingGoals){const g=d.readingGoals;if(!Number.isInteger(g.englishWeekly)||g.englishWeekly<1||g.englishWeekly>100||!Number.isInteger(g.chineseWeekly)||g.chineseWeekly<3||g.chineseWeekly>100||![1,2].includes(g.bookMonths)||!validDate(g.bookStart))return false;}

  return true;
}

function shiftDate(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function weekWindow(at=dateISO()){const weekday=new Date(at+'T12:00:00Z').getUTCDay();const start=shiftDate(at,-((weekday+6)%7));return {start,end:shiftDate(start,6)}}

function bookWindow(goals=db.readingGoals,at=dateISO()){
  const anchor=goals.bookStart,months=goals.bookMonths;let cycle=0;
  if(at>=anchor){const monthDiff=(Number(at.slice(0,4))-Number(anchor.slice(0,4)))*12+Number(at.slice(5,7))-Number(anchor.slice(5,7));cycle=Math.max(0,Math.floor(monthDiff/months));while(cycle>0&&addMonths(anchor,cycle*months)>at)cycle--;while(addMonths(anchor,(cycle+1)*months)<=at)cycle++;}
  const start=addMonths(anchor,cycle*months),next=addMonths(anchor,(cycle+1)*months);return {start,end:shiftDate(next,-1)};
}
function readingStats(at=dateISO()){
  const week=weekWindow(at),book=bookWindow(db.readingGoals,at);
  const read=db.refs.filter(r=>r.readDate&&r.readDate<=at);
  const weekly=read.filter(r=>r.resourceType==='paper'&&r.readDate>=week.start&&r.readDate<=week.end);
  return {week,book,english:weekly.filter(r=>r.language==='en').length,chinese:weekly.filter(r=>r.language==='zh').length,books:read.filter(r=>r.resourceType==='book'&&r.readDate>=book.start&&r.readDate<=book.end).length};

function countdownInfo(deadline,now=Date.now()){
  const end=new Date(deadline+'T23:59:59.999+08:00').getTime();
  if(!Number.isFinite(end))return {text:'未设期限',overdue:false};
  const overdue=now>end,seconds=Math.floor(Math.abs(end-now)/1000),days=Math.floor(seconds/86400),h=Math.floor(seconds%86400/3600),m=Math.floor(seconds%3600/60),s=seconds%60;
  return {overdue,days,text:`${overdue?'逾期':'剩余'} ${days} 天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
}

const fileSaveState={supported:typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function'&&window.isSecureContext!==false,loading:true,handle:null,status:'off',lastText:'',lastData:'',lastSaved:'',pending:null,running:null,timer:null,remembered:true,error:''};
let selectedDataFile=null;
function fileStore(operation,value){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('无法记住数据文件'));return}const request=window.indexedDB.open('yanxu-file-save-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const store=request.result,transaction=store.transaction('files',operation==='get'?'readonly':'readwrite'),object=transaction.objectStore('files');let result;const action=operation==='get'?object.get('active'):operation==='put'?object.put(value,'active'):object.delete('active');action.onsuccess=()=>{result=action.result};transaction.oncomplete=()=>{store.close();resolve(result)};transaction.onerror=()=>{store.close();reject(transaction.error)};transaction.onabort=()=>{store.close();reject(transaction.error||new Error('无法保存文件设置'))}}})}
function fileSaveSnapshot(){return {text:JSON.stringify(db,null,2),data:JSON.stringify(db)}}
function fileSaveStatus(){const s=fileSaveState;if(s.loading)return '正在读取文件设置';if(!s.supported)return '当前浏览器不支持指定文件保存';return {off:'尚未选择数据文件',ready:'已自动保存到文件',pending:'等待写入数据文件',saving:'正在保存到文件',permission:'需要允许文件访问',conflict:'文件有新的修改，已暂停写入',error:'文件保存未完成'}[s.status]||'浏览器本地保存'}
function renderFileSaveInner(){const s=fileSaveState,busy=s.loading||s.status==='saving',disabled=!s.supported||busy;return `<h2>${icon('down')} 数据保存位置</h2><p>选择一个 JSON 数据文件。以后保存论文、修改阶段、记录阅读或调整设置时，数据会自动写入同一个文件。</p><div class="file-save-status" data-status="${s.status}" role="status"><strong>${esc(fileSaveStatus())}</strong><span>${s.handle?'数据文件：'+esc(s.handle.name):'默认仍保存在当前浏览器'}</span>${s.lastSaved?`<small>最近写入：${esc(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium'}).format(new Date(s.lastSaved)))}</small>`:''}${s.error?`<small>${esc(s.error)}</small>`:''}${!s.remembered?'<small>本次选择未能记住。下次打开请重新选择这个文件。</small>':''}</div><div class="action-stack file-save-actions"><button class="btn primary" data-action="chooseDataFile" ${disabled?'disabled':''}>${s.handle?'另选保存位置':'选择保存位置'}</button><button class="btn" data-action="openDataFile" ${disabled?'disabled':''}>打开已有数据文件</button>${s.handle?`${s.status==='permission'?`<button class="btn" data-action="resumeDataFile" ${busy?'disabled':''}>允许访问并继续</button>`:s.status==='conflict'?`<button class="btn" data-action="reloadDataFile" ${busy?'disabled':''}>从文件重新载入</button>`:`<button class="btn" data-action="saveDataFileNow" ${busy?'disabled':''}>${s.status==='error'?'重试保存':'立即保存'}</button>`}<button class="text-button" data-action="pauseDataFile" ${busy?'disabled':''}>暂停文件保存</button>`:''}</div><p class="file-save-help">${s.supported?'保存后请等到“已自动保存到文件”再关闭页面。浏览器会记住文件选择，必要时会请你重新允许访问。':'请在电脑端 Chrome 或 Edge 中打开；支持情况以页面检测为准。当前仍可使用下方的 JSON 导出备份。'}<br>文件夹路径由系统选择窗口指定，页面只显示文件名。保存到本地文件不会自动实现手机、电脑之间的同步。</p>`}
function renderDataFileSettings(){return `<section class="settings-card file-save-panel" id="fileSavePanel">${renderFileSaveInner()}</section>`}
function updateFileSaveUI(){const panel=$('#fileSavePanel');if(panel)panel.innerHTML=renderFileSaveInner();const label=$('.local-info');if(label){const s=fileSaveState;label.innerHTML=`<span class="dot"></span> ${s.handle?esc(fileSaveStatus()):storageAvailable?'数据已存于浏览器':'本地保存暂不可用'}<small>${s.handle?esc(s.handle.name):'让每一点灵感，都有迹可循。'}</small>`}}
async function rememberDataFile(){const s=fileSaveState;try{await fileStore('put',{handle:s.handle,lastText:s.lastText,lastData:s.lastData,lastSaved:s.lastSaved});s.remembered=true}catch(e){s.remembered=false}}
function showFileSaveError(error){const s=fileSaveState;s.status=error?.name==='NotAllowedError'?'permission':'error';s.error=s.status==='permission'?'浏览器未允许写入。请点击“允许访问并继续”。':'文件暂时无法写入。数据仍保存在浏览器，可重试、另选文件或导出备份。';updateFileSaveUI()}
async function dataFileText(handle){const file=await handle.getFile();if(file.size>10*1024*1024)throw new Error('数据文件超过 10MB，请换用较小的数据文件。');return file.text()}
function parseDataFile(text){let data;try{data=JSON.parse(text)}catch{throw new Error('文件无法读取，请选择研序导出的 JSON 数据文件。')}if(!validDB(data))throw new Error('文件格式不匹配，请选择研序的数据文件。');return upgradeDB(data)}
function queueDataFileSave(){const s=fileSaveState;if(!s.handle||s.loading||['off','permission','conflict','error'].includes(s.status))return;s.pending=fileSaveSnapshot();if(s.pending.data===s.lastData&&!s.running){s.pending=null;s.status='ready';updateFileSaveUI();return}s.status=s.running?'saving':'pending';updateFileSaveUI();clearTimeout(s.timer);s.timer=setTimeout(()=>{void flushDataFileSave()},250)}
async function flushDataFileSave(){const s=fileSaveState;clearTimeout(s.timer);if(s.running)return s.running;if(!s.handle||['permission','conflict','off'].includes(s.status))return false;if(!s.pending)s.pending=fileSaveSnapshot();s.status='saving';s.error='';updateFileSaveUI();const work=async()=>{let success=true;while(s.pending){const snapshot=s.pending;s.pending=null;try{const write=async()=>{if(await s.handle.queryPermission({mode:'readwrite'})!=='granted'){const e=new Error('需要文件权限');e.name='NotAllowedError';throw e}const before=await dataFileText(s.handle);if(before!==s.lastText){s.pending=fileSaveSnapshot();s.status='conflict';s.error='文件内容与上次保存不同。可重新载入文件，或另选文件保存当前工作空间。';updateFileSaveUI();return false}const writer=await s.handle.createWritable();try{await writer.write(snapshot.text);await writer.close()}catch(error){try{await writer.abort()}catch{}throw error}s.lastText=snapshot.text;s.lastData=snapshot.data;s.lastSaved=new Date().toISOString();await rememberDataFile();return true};const wrote=window.navigator?.locks?await window.navigator.locks.request('yanxu-data-file-save',write):await write();if(!wrote){success=false;break}}catch(error){s.pending=fileSaveSnapshot();showFileSaveError(error);success=false;break}}if(success){s.status='ready';s.error='';updateFileSaveUI()}return success};s.running=work();try{return await s.running}finally{s.running=null;updateFileSaveUI()}}
async function reconcileDataFile(){const s=fileSaveState;const text=await dataFileText(s.handle),current=fileSaveSnapshot();if(text!==s.lastText){if(current.data!==s.lastData){s.status='conflict';s.error='浏览器和数据文件都有未同步的修改。请先导出当前数据，再重新载入文件，或另选文件保存。';updateFileSaveUI();return}db=parseDataFile(text);s.lastText=text;s.lastData=JSON.stringify(db);try{localStorage.setItem(STORAGE,s.lastData);storageAvailable=true}catch{storageAvailable=false}render();await rememberDataFile()}s.status='ready';s.error='';s.loading=false;queueDataFileSave();updateFileSaveUI()}
async function initDataFileSave(){const s=fileSaveState;if(!s.supported){s.loading=false;updateFileSaveUI();return}try{const record=await fileStore('get');if(record?.handle){s.handle=record.handle;s.lastText=record.lastText||'';s.lastData=record.lastData||'';s.lastSaved=record.lastSaved||'';if(await s.handle.queryPermission({mode:'readwrite'})==='granted')await reconcileDataFile();else{s.status='permission';s.error='请允许访问已选择的数据文件。修改会先保存在浏览器。'}}}catch(error){if(s.handle)showFileSaveError(error);else{s.remembered=false}}finally{s.loading=false;updateFileSaveUI()}}
async function activateDataFile(handle,text,load=false){const s=fileSaveState;try{if(s.running)await s.running;if(await dataFileText(handle)!==text)throw new Error('文件已变化，请重新选择。');const loaded=load?parseDataFile(text):null;s.handle=handle;s.lastText=text;s.lastData=loaded?JSON.stringify(loaded):'';s.lastSaved='';s.pending=null;s.loading=false;s.status='ready';s.error='';if(load){db=loaded;persist();render()}await rememberDataFile();s.pending=fileSaveSnapshot();const ok=await flushDataFileSave();if(ok)toast('数据文件已连接，后续修改会自动保存。')}catch(error){showFileSaveError(error)}}
function dataFileChoice(handle,text){const data=parseDataFile(text);selectedDataFile={handle,text};modal('这个文件已有科研数据','选择读取文件，或将当前工作空间保存到此文件。',`<p class="confirm-copy">文件：${esc(handle.name)}<br>文件内：${data.papers.length} 篇论文、${data.tasks.length} 项任务、${data.refs.length} 条文献。<br>当前空间：${db.papers.length} 篇论文、${db.tasks.length} 项任务、${db.refs.length} 条文献。<br>读取会替换当前工作空间；覆盖会替换文件原有内容。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn" data-action="useExistingDataFile">读取文件内容</button><button class="btn primary" data-action="replaceExistingDataFile">用当前数据覆盖文件</button>`)}
async function chooseDataFile(){if(!fileSaveState.supported){toast('当前浏览器不支持，请使用电脑端 Chrome 或 Edge。');return}try{const handle=await window.showSaveFilePicker({id:'yanxu-data-file',suggestedName:'研序-科研数据.json',types:[{description:'研序 JSON 数据文件',accept:{'application/json':['.json']}}]});const text=await dataFileText(handle);if(text.trim()){dataFileChoice(handle,text);return}await activateDataFile(handle,text)}catch(error){if(error.name!=='AbortError')toast(error.message||'无法选择数据文件。')}}
async function openDataFile(){if(!fileSaveState.supported)return;try{const [handle]=await window.showOpenFilePicker({id:'yanxu-data-file',multiple:false,types:[{description:'研序 JSON 数据文件',accept:{'application/json':['.json']}}]});const text=await dataFileText(handle),loaded=parseDataFile(text);selectedDataFile={handle,text};modal('打开数据文件？','确认后将读取此文件，并连接自动保存。',`<p class="confirm-copy">${esc(handle.name)}<br>${loaded.papers.length} 篇论文、${loaded.tasks.length} 项任务、${loaded.refs.length} 条文献。<br>读取会替换当前工作空间，建议先导出当前数据备份。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="useExistingDataFile">读取并连接</button>`)}catch(error){if(error.name!=='AbortError')toast(error.message||'无法读取数据文件。')}}
async function useSelectedDataFile(load){const selected=selectedDataFile;if(!selected)return;try{if(await selected.handle.requestPermission({mode:'readwrite'})!=='granted'){toast('未允许写入，文件没有连接。');return}selectedDataFile=null;closeModal();await activateDataFile(selected.handle,selected.text,load)}catch(error){toast('未能连接文件，请重新选择。')}}
async function resumeDataFile(){const s=fileSaveState;if(!s.handle)return;try{if(await s.handle.requestPermission({mode:'readwrite'})!=='granted'){toast('文件权限未开启，数据仍保存在浏览器。');return}await reconcileDataFile();if(['ready','pending'].includes(s.status)){s.pending=fileSaveSnapshot();await flushDataFileSave()}}catch(error){showFileSaveError(error)}}
async function saveDataFileNow(){const s=fileSaveState;if(!s.handle)return;if(s.status==='permission'){await resumeDataFile();return}flushDeadlineInputs();s.pending=fileSaveSnapshot();const ok=await flushDataFileSave();if(ok)toast('数据已写入所选文件。')}
async function reloadDataFile(){const s=fileSaveState;if(!s.handle)return;try{const text=await dataFileText(s.handle),data=parseDataFile(text);selectedDataFile={handle:s.handle,text};modal('重新载入文件？','文件的新内容将替换浏览器中的工作空间。',`<p class="confirm-copy">${esc(s.handle.name)}<br>${data.papers.length} 篇论文、${data.tasks.length} 项任务、${data.refs.length} 条文献。<br>请先导出当前数据，以保留浏览器里尚未写入文件的修改。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="useExistingDataFile">读取并连接</button>`)}catch(error){showFileSaveError(error)}}
async function pauseDataFile(){const s=fileSaveState;clearTimeout(s.timer);if(s.running)await s.running;if(s.pending&&!['conflict','permission','error'].includes(s.status))await flushDataFileSave();try{await fileStore('delete')}catch{}s.handle=null;s.pending=null;s.status='off';s.lastSaved='';s.lastText='';s.lastData='';s.error='';updateFileSaveUI();toast('已暂停文件保存，原数据文件仍保留。')}
Object.assign(actions,{chooseDataFile,openDataFile,resumeDataFile,saveDataFileNow,reloadDataFile,pauseDataFile,useExistingDataFile:()=>useSelectedDataFile(true),replaceExistingDataFile:()=>useSelectedDataFile(false)});
window.addEventListener('beforeunload',e=>{if(fileSaveState.handle&&(fileSaveState.pending||fileSaveState.running)&&!['permission','conflict','error'].includes(fileSaveState.status)){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&fileSaveState.pending&&!['permission','conflict','error'].includes(fileSaveState.status))void flushDataFileSave()});

$('#searchIcon').innerHTML=icon('search');$('#notifications').innerHTML=icon('bell');$('.mobile-menu').innerHTML=icon('menu');if(navItems.some(n=>n[0]===location.hash.slice(1)))page=location.hash.slice(1);persist();render();void initDataFileSave();

setInterval(updateDeadlineClocks,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateDeadlineClocks()});

setInterval(()=>{const current=dateISO();if(current!==today&&!$('#modal').open){today=current;render()}},60000);
